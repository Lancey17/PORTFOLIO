<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      color: #ffffff;
      background: url('background.png') no-repeat center center fixed;
      background-size: cover;
    }
    header {
      text-align: center;
      padding: 40px;
      background: rgba(0,0,0,0.6);
    }
    header h1 {
      font-size: 2.5em;
      color: #00bfff;
    }
    nav {
      margin-top: 20px;
    }
    nav a {
      margin: 0 15px;
      color: #00bfff;
      text-decoration: none;
      font-weight: bold;
    }
    section {
      padding: 40px;
      background: rgba(0,0,0,0.6);
      margin: 20px;
      border-radius: 8px;
    }
    footer {
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.6);
      color: #aaa;
    }
  </style>
</head>
